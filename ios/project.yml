name: Isobot
options:
  bundleIdPrefix: tech.isolated
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Isobot:
    type: application
    platform: iOS
    sources:
      - path: Isobot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.isolated.isobot
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Isobot/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - IsobotTests
  IsobotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IsobotTests
    dependencies:
      - target: Isobot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
